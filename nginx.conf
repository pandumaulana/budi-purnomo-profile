server {
    listen 80;
    listen [::]:80;
    server_name budipurnomo.com www.budipurnomo.com;

    # Redirect HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name budipurnomo.com www.budipurnomo.com;

    # SSL — sesuaikan path setelah certbot
    ssl_certificate     /etc/letsencrypt/live/budipurnomo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budipurnomo.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Root folder — isi dengan path tempat Anda upload folder dist/
    root /var/www/budipurnomo.com/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing — semua request diarahkan ke index.html
    # Ini penting agar /blog/:slug tidak 404 saat di-refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
